# IMDb indeks za Kino na Samsung TV-u: svaki dan iz IMDb-ovih skupova podataka (osobna nekomercijalna upotreba).
# Rezultat je na grani "data" (jedan commit, prepisuje se — povijest ne raste), šifriran tajnom IMDB_KEY.
name: IMDb indeks
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
        env:
          IMDB_KEY: ${{ secrets.IMDB_KEY }}
      - name: Objavi na granu data
        run: |
          cd out
          git init -q -b data
          git config user.name "kino-imdb"
          git config user.email "kino-imdb@users.noreply.github.com"
          git add imdb.bin meta.json
          git commit -qm "IMDb indeks $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
